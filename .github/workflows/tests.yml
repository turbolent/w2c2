name: tests

on:
  push:
    branches:
      - main
    tags:
      - '**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    name: "Linux, ${{ matrix.system.target }} (build=${{ matrix.build }}, threads=${{ matrix.threads }})"

    strategy:
      fail-fast: false
      matrix:
        build: [release, debug]
        threads: [true, false]
        system:
          - { target: gcc,                                              cc: gcc                                                                         }
          - { target: clang,                                            cc: clang                                                                       }
          - { target: arm,      toolchain: gcc-arm-linux-gnueabi,       cc: arm-linux-gnueabi-gcc,       qemu: qemu-arm-static,        linkAtomic: true }
          - { target: armhf,    toolchain: gcc-arm-linux-gnueabihf,     cc: arm-linux-gnueabihf-gcc,     qemu: qemu-arm-static                          }
          - { target: aarch64,  toolchain: gcc-aarch64-linux-gnu,       cc: aarch64-linux-gnu-gcc,       qemu: qemu-aarch64-static                      }
          - { target: riscv64,  toolchain: gcc-riscv64-linux-gnu,       cc: riscv64-linux-gnu-gcc,       qemu: qemu-riscv64-static,    linkAtomic: true }
          - { target: ppc,      toolchain: gcc-powerpc-linux-gnu,       cc: powerpc-linux-gnu-gcc,       qemu: qemu-ppc-static,        linkAtomic: true }
          - { target: ppc64,    toolchain: gcc-powerpc64-linux-gnu,     cc: powerpc64-linux-gnu-gcc,     qemu: qemu-ppc64-static                        }
          - { target: s390x,    toolchain: gcc-s390x-linux-gnu,         cc: s390x-linux-gnu-gcc,         qemu: qemu-s390x-static                        }
          - { target: alpha,    toolchain: gcc-alpha-linux-gnu,         cc: alpha-linux-gnu-gcc,         qemu: qemu-alpha-static                        }

          # Architectures with expected failures (mostly due to FP issues, e.g. NaN representation, conversion, arithemtic)
          - { target: i386,     toolchain: gcc-multilib,                cc: clang -m32,                  qemu: qemu-i386-static,       linkAtomic: true, cflags: -Wno-atomic-alignment }
          # The expanded floating-point tests require long calls on HPPA.
          - { target: hppa,     toolchain: gcc-hppa-linux-gnu,          cc: hppa-linux-gnu-gcc,          qemu: qemu-hppa-static, cflags: -mlong-calls    }
          - { target: mips,     toolchain: gcc-mips-linux-gnu,          cc: mips-linux-gnu-gcc,          qemu: qemu-mips-static,       linkAtomic: true }
          - { target: mipsel,   toolchain: gcc-mipsel-linux-gnu,        cc: mipsel-linux-gnu-gcc,        qemu: qemu-mipsel-static,     linkAtomic: true }
          - { target: mips64,   toolchain: gcc-mips64-linux-gnuabi64,   cc: mips64-linux-gnuabi64-gcc,   qemu: qemu-mips64-static                       }
          - { target: mips64el, toolchain: gcc-mips64el-linux-gnuabi64, cc: mips64el-linux-gnuabi64-gcc, qemu: qemu-mips64el-static                     }
          - { target: ppc64le,  toolchain: gcc-powerpc64le-linux-gnu,   cc: powerpc64le-linux-gnu-gcc,   qemu: qemu-ppc64le-static                      }

          # Disabled due to miscompilation or qemu issues (?)
          # - { target: sh4,      toolchain: gcc-sh4-linux-gnu,           cc: sh4-linux-gnu-gcc,           qemu: qemu-sh4-static                          }
          # - { target: sparc64,  toolchain: gcc-sparc64-linux-gnu,       cc: sparc64-linux-gnu-gcc,       qemu: qemu-sparc64-static                      }

          # Disabled due to too large `switch'-statement
          # - { target: m68k,     toolchain: gcc-m68k-linux-gnu,          cc: m68k-linux-gnu-gcc,          qemu: qemu-m68k-static                         }

    env:
      CC: ${{ matrix.system.cc }}
      CFLAGS: -Werror ${{ matrix.system.cflags }} ${{ startsWith(matrix.system.cc, 'clang') && '-ffp-model=strict' || '-fno-fast-math -fno-rounding-math -fsignaling-nans -ffp-contract=off -fexcess-precision=standard' }}

    steps:
      - uses: actions/checkout@v3

      - name: Install QEMU
        if: ${{ matrix.system.qemu }}
        run: |
          sudo apt update
          sudo apt install qemu-user-static

      - name: Install ${{ matrix.system.toolchain }}
        if: ${{ matrix.system.toolchain }}
        run: |
          sudo apt install ${{ matrix.system.toolchain }}

      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            w2c2:
              - '.github/workflows/tests.yml'
              - 'w2c2/**'
              - 'examples/embed/**'
              - 'futex/**'
              - 'tests/**'
            wasi:
              - '.github/workflows/tests.yml'
              - 'wasi/**'
              - 'w2c2/w2c2_base.h'

      - if: steps.changes.outputs.w2c2 == 'true'
        name: Build w2c2
        env:
          LDFLAGS: -static
        working-directory: ./w2c2
        run: make BUILD=${{ matrix.build }} FEATURES="unistd libgen getopt glob ${{ matrix.threads && 'threads' || '' }}"

      - if: steps.changes.outputs.w2c2 == 'true'
        name: Test w2c2
        env:
          LDFLAGS: -static
        working-directory: ./w2c2
        run: make test BUILD=${{ matrix.build }} FEATURES="unistd libgen getopt glob ${{ matrix.threads && 'threads' || '' }}"

      - if: steps.changes.outputs.w2c2 == 'true' && matrix.system.target == 'clang' && matrix.build == 'debug'
        name: Test w2c2 with ASan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        working-directory: ./w2c2
        run: |
          make clean
          make BUILD=debug SANITIZERS=address FEATURES="unistd libgen getopt glob ${{ matrix.threads && 'threads' || '' }}"
          make test BUILD=debug SANITIZERS=address FEATURES="unistd libgen getopt glob ${{ matrix.threads && 'threads' || '' }}"

      - if: steps.changes.outputs.w2c2 == 'true' && matrix.threads
        name: Build futex
        working-directory: ./futex
        run: make BUILD=${{ matrix.build }}

      - if: steps.changes.outputs.w2c2 == 'true' && matrix.threads
        name: Run WebAssembly tests
        env:
          LDFLAGS: -static ${{ matrix.system.linkAtomic && '-latomic' || '' }}
          ARCH: ${{ matrix.system.target }}
          OPT: ${{ matrix.build == 'release' && matrix.system.target == 'clang' && '-O3' || '-O0' }}
        working-directory: ./tests
        shell: bash
        run: make run-tests

      - if: steps.changes.outputs.w2c2 == 'true' && matrix.threads && matrix.system.target == 'gcc' && matrix.build == 'release'
        name: Run optimized floating-point tests
        env:
          LDFLAGS: -static
          ARCH: gcc
        working-directory: ./tests
        # The full GCC -O3 corpus hits existing memory.init overread warnings;
        # keep -Werror enabled while testing floating-point optimization.
        run: make -B run-tests-conversions run-tests-f32 run-tests-f64 run-tests-float OPT=-O3

      - if: steps.changes.outputs.w2c2 == 'true' && matrix.threads && matrix.system.target != 'clang'
        name: Test futex
        env:
          LDFLAGS: -static ${{ matrix.system.linkAtomic && '-latomic' || '' }}
        working-directory: ./futex
        run: make test BUILD=${{ matrix.build }}

      - if: steps.changes.outputs.w2c2 == 'true' && matrix.threads && matrix.system.target == 'clang'
        name: Test futex with AddressSanitizer
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        working-directory: ./futex
        run: |
          make clean
          make test BUILD=${{ matrix.build }} SANITIZERS=address

      - if: steps.changes.outputs.w2c2 == 'true' && matrix.threads && matrix.system.target == 'clang' && matrix.build == 'debug'
        name: Test runtime ownership with AddressSanitizer
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        working-directory: ./tests
        run: make runtime-lifecycle-test SANITIZERS=address

      - if: steps.changes.outputs.wasi == 'true' && matrix.threads && matrix.system.target != 'clang'
        name: Build wasi
        working-directory: ./wasi
        run: make BUILD=${{ matrix.build }}

      - if: steps.changes.outputs.wasi == 'true' && matrix.threads && matrix.system.target != 'clang'
        name: Test wasi
        env:
          LDFLAGS: -static ${{ matrix.system.linkAtomic && '-latomic' || '' }}
        working-directory: ./wasi
        run: make test BUILD=${{ matrix.build }}

      - if: steps.changes.outputs.wasi == 'true' && matrix.threads && matrix.system.target == 'clang'
        name: Test WASI with AddressSanitizer
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        working-directory: ./wasi
        run: make test BUILD=${{ matrix.build }} SANITIZERS=address
  macos:
    runs-on: macos-latest
    name: "macOS (build=${{ matrix.build }}, threads=${{ matrix.threads }})"

    strategy:
      fail-fast: false
      matrix:
        build: [release, debug]
        threads: [true, false]

    env:
      CFLAGS: -Werror -ffp-model=strict

    steps:
      - uses: actions/checkout@v3

      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            w2c2:
              - '.github/workflows/tests.yml'
              - 'w2c2/**'
              - 'examples/embed/**'
              - 'futex/**'
              - 'tests/**'
            wasi:
              - '.github/workflows/tests.yml'
              - 'wasi/**'
              - 'w2c2/w2c2_base.h'

      - if: steps.changes.outputs.w2c2 == 'true'
        name: Build w2c2
        working-directory: ./w2c2
        run: make BUILD=${{ matrix.build }} FEATURES="unistd libgen getopt glob ${{ matrix.threads && 'threads' || '' }}"

      - if: steps.changes.outputs.w2c2 == 'true'
        name: Test w2c2
        working-directory: ./w2c2
        run: make test BUILD=${{ matrix.build }} FEATURES="unistd libgen getopt glob ${{ matrix.threads && 'threads' || '' }}"

      - if: steps.changes.outputs.w2c2 == 'true' && matrix.threads
        name: Build futex
        working-directory: ./futex
        run: make BUILD=${{ matrix.build }}

      - if: steps.changes.outputs.w2c2 == 'true' && matrix.threads
        name: Test futex
        working-directory: ./futex
        run: make test BUILD=${{ matrix.build }}

      - if: steps.changes.outputs.w2c2 == 'true' && matrix.threads
        name: Run WebAssembly tests
        env:
          OPT: ${{ matrix.build == 'release' && '-O3' || '-O0' }}
        working-directory: ./tests
        shell: bash
        run: make run-tests

      - if: steps.changes.outputs.wasi == 'true' && matrix.threads
        name: Build wasi
        working-directory: ./wasi
        run: make BUILD=${{ matrix.build }} FEATURES="unistd sysuio systime sysresource strndup fcntl timespec lstat poll pthreads"

      - if: steps.changes.outputs.wasi == 'true' && matrix.threads
        name: Test wasi
        working-directory: ./wasi
        run: make test BUILD=${{ matrix.build }} FEATURES="unistd sysuio systime sysresource strndup fcntl timespec lstat poll pthreads"

  library:
    runs-on: ${{ matrix.os }}
    name: "Library (${{ matrix.os }}, shared=${{ matrix.shared }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shared: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@v3
      - name: Build and test library
        run: |
          cmake -S w2c2 -B build -DSHARED_LIB=${{ matrix.shared }}
          cmake --build build --parallel 4
          ctest --test-dir build --output-on-failure
      - name: Test relocated installation
        run: |
          cmake --install build --prefix "$PWD/install"
          mv install relocated
          cmake -S tests/embedding -B consumer -DCMAKE_PREFIX_PATH="$PWD/relocated"
          cmake --build consumer --parallel 4
          ctest --test-dir consumer --output-on-failure
          printf '\000asm\001\000\000\000' > empty.wasm
          relocated/bin/w2c2 empty.wasm empty.c
      - name: Test Make library and installation
        run: |
          shared=0
          if [ "${{ matrix.shared }}" = "ON" ]; then shared=1; fi
          make -C w2c2 test SHARED_LIB=$shared
          make -C w2c2 install SHARED_LIB=$shared PREFIX=/w2c2 DESTDIR="$PWD/stage"
          stage/w2c2/bin/w2c2 empty.wasm make.c

  windows-msvc:
    runs-on: windows-latest
    name: "Windows (MSVC)"
    env:
      CL: /fp:strict

    steps:
      - uses: actions/checkout@v3
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            w2c2:
              - '.github/workflows/tests.yml'
              - 'w2c2/**'
              - 'examples/embed/**'
              - 'tests/embedding/**'
            wasi:
              - '.github/workflows/tests.yml'
              - 'wasi/**'
              - 'w2c2/w2c2_base.h'

      - if: steps.changes.outputs.w2c2 == 'true'
        name: Build w2c2
        working-directory: ./w2c2
        run: |
          cmake -Bbuild -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build build
          ctest --test-dir build -C Debug --output-on-failure
          cmake --install build --config Debug --prefix "$PWD/install"
          Move-Item install relocated
          cmake -S ../tests/embedding -B consumer -DCMAKE_PREFIX_PATH="$PWD/relocated"
          cmake --build consumer
          ctest --test-dir consumer -C Debug --output-on-failure

      - if: steps.changes.outputs.w2c2 == 'true'
        name: Reject Windows shared library configuration
        working-directory: ./w2c2
        run: |
          cmake -B shared-build -DSHARED_LIB=ON
          if ($LASTEXITCODE -eq 0) { throw "Windows shared libraries must be rejected" }
          exit 0

      - if: steps.changes.outputs.wasi == 'true'
        name: Build wasi
        working-directory: ./wasi
        run: |
          cmake -Bbuild -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build build
